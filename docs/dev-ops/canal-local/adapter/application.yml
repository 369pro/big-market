server:
  port: 8081
spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

canal.conf:
  mode: tcp
  flatMessage: true
  zookeeperHosts:
  syncBatchSize: 1000
  retries: -1
  timeout:
  accessKey:
  secretKey:
  consumerProperties:
    canal.tcp.server.host: canal-server:11111
    canal.tcp.zookeeper.hosts:
    canal.tcp.batch.size: 500
    canal.tcp.username:
    canal.tcp.password:
  srcDataSources:
    big_market_01:
      url: jdbc:mysql://host.docker.internal:3306/big_market_01?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: ${LOCAL_MYSQL_USERNAME}
      password: ${LOCAL_MYSQL_PASSWORD}
    big_market_02:
      url: jdbc:mysql://host.docker.internal:3306/big_market_02?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: ${LOCAL_MYSQL_USERNAME}
      password: ${LOCAL_MYSQL_PASSWORD}
  canalAdapters:
    - instance: example
      groups:
        - groupId: g1
          outerAdapters:
            - name: logger
            - name: es7
              hosts: host.docker.internal:9200
              properties:
                mode: rest
                cluster.name: docker-cluster
