server:
  address: 0.0.0.0
  port: 8091

spring:
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/openai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${LOCAL_MYSQL_USERNAME:root}
    password: ${LOCAL_MYSQL_PASSWORD}

redis:
  sdk:
    config:
      host: redis
      port: 6379
      password: "123456"

dubbo:
  registry:
    address: nacos://nacos:8848

logging:
  config: file:/config/logback-local.xml

llm:
  providers:
    deepseek:
      api-key: "REDACTED"
      base-url: "https://api.deepseek.com/"
