name: kibnan

services:
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.14
    restart: unless-stopped
    environment:
      SERVER_HOST: 0.0.0.0
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      I18N_LOCALE: zh-CN
      TELEMETRY_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=1024
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - market
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

networks:
  market:
    external: true
    name: ${MARKET_DOCKER_NETWORK:-llm-market-local_default}
